<app-property-binding
  [isUnchanged]="isUnchanged"
  [evilTitle]="evilTitle"
  [interpolationTitle]="interpolationTitle"
  [itemImageUrl]="itemImageUrl"
  [propertyTitle]="propertyTitle"
></app-property-binding>
<app-event-binding
  [currentItem]="currentItem"
  [clickMessage]="clickMessage"
  (save)="onSave($event)"
  (delete)="deleteItem($event)"
  (click)="onClickMe($event)"
  (inputChanged)="currentItem.name = getValue($event)"
></app-event-binding>
<app-text-interpolation
  [currentCustomer]="currentCustomer"
  [itemImageUrl]="itemImageUrl"
></app-text-interpolation>
<nav>
  <ul>
    <li>
      <a routerLink="/first-component" routerLinkActive="active">First</a>
    </li>
    <li>
      <a routerLink="/second-component" routerLinkActive="active">Second</a>
    </li>
  </ul>
</nav>
<router-outlet></router-outlet>
