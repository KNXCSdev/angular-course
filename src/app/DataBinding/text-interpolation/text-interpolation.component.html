<h1>Text interpolation</h1>

<div class="group">
  <h2>Interpolation</h2>
  <h3>Current customer: {{ currentCustomer }}</h3>

  <div><img alt="item" width="100" src="{{ itemImageUrl }}" /></div>

  <h3>Evaluating template expressions</h3>
  <h4>Simple evaluation (to a string):</h4>
  <!-- "The sum of 1 + 1 is 2" -->
  <p>The sum of 1 + 1 is {{ 1 + 1 }}.</p>
</div>

<div class="group">
  <h2>Expression Context</h2>

  <div (keyup)="(0)">
    <h4>Template context: template reference variables (#customerInput):</h4>
    <label
      >Type something: <input #customerInput />{{ customerInput.value }}
    </label>
  </div>
</div>
